name: E2E Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinycms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: apps/api

      - name: Prepare API env
        run: cp .env.cli .env
        working-directory: apps/api

      - name: Run Migrations
        run: vendor/bin/doctrine-migrations migrate --no-interaction
        working-directory: apps/api

      - name: Seed Admin User
        run: php bin/create-admin.php admin@example.com password123
        working-directory: apps/api

      - name: Start API Server
        run: php -S localhost:8080 public/index.php > api.log 2>&1 &
        working-directory: apps/api

      - name: Wait for API health check
        run: |
          timeout 30s sh -c 'until curl -s http://localhost:8080/health; do sleep 1; done'

      - name: Install Admin dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: apps/admin

      - name: Prepare Admin env
        run: echo "VITE_API_URL=/api" > .env
        working-directory: apps/admin

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/admin

      - name: Run E2E tests
        run: pnpm test:e2e --project=chromium
        working-directory: apps/admin
        env:
          BASE_URL: http://localhost:5173
          VITE_API_PROXY_TARGET: http://localhost:8080
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/admin/playwright-report/
          retention-days: 30

      - name: Print API logs on failure
        if: failure()
        run: cat apps/api/api.log

      - name: Upload API logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-logs
          path: apps/api/api.log
